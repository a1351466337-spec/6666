name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KSPASS: tartarus-ks-pass
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The original TartarusSolver (MIT) is fetched at build time and referenced as it is.
      - name: Fetch upstream TartarusSolver
        run: |
          git clone --depth 1 https://github.com/glcoder/TartarusSolver.git upstream
          cat > upstream/Directory.Build.props <<'EOF'
          <Project>
            <PropertyGroup>
              <LangVersion>latest</LangVersion>
              <Nullable>enable</Nullable>
              <ImplicitUsings>enable</ImplicitUsings>
              <TreatWarningsAsErrors>false</TreatWarningsAsErrors>
              <OcrModelDir>$(MSBuildThisFileDirectory)models/ocr/</OcrModelDir>
            </PropertyGroup>
          </Project>
          EOF
          # Models are looked up under $TARTARUS_HOME when it is set (the app sets it to its files folder).
          sed -i 's/AppContext\.BaseDirectory/(Environment.GetEnvironmentVariable("TARTARUS_HOME") ?? AppContext.BaseDirectory)/g' upstream/src/Shared/AppFiles.cs

      # Building the vision library once downloads the PaddleOCR models into upstream/models/ocr.
      - name: Download OCR models
        run: dotnet build upstream/src/Tartarus.Vision/Tartarus.Vision.csproj -c Release

      - name: Install Android workload
        run: dotnet workload install android

      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: tartarus.keystore
          key: tartarus-keystore-v1

      - name: Create signing key (first run only)
        run: |
          test -f tartarus.keystore || keytool -genkeypair -keystore tartarus.keystore -alias tartarus \
            -keyalg RSA -keysize 2048 -validity 10000 -storepass "$KSPASS" -keypass "$KSPASS" -dname "CN=Tartarus Helper"

      - name: Build APK
        run: |
          dotnet publish TartarusAndroid/TartarusAndroid.csproj -f net9.0-android -c Release \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$GITHUB_WORKSPACE/tartarus.keystore" \
            -p:AndroidSigningKeyAlias=tartarus \
            -p:AndroidSigningKeyPass=env:KSPASS \
            -p:AndroidSigningStorePass=env:KSPASS

      - name: Collect APK
        run: |
          mkdir -p out
          find TartarusAndroid/bin -name '*.apk' -exec cp {} out/ \;
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: tartarus-apk
          path: out/*.apk
